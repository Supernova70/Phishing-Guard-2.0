<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/shield.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Phishing-Guard 2.0 — AI-powered email phishing detection and security operations dashboard" />
    <meta name="theme-color" content="#f3f6fb" />
    <title>Phishing-Guard 2.0 — SOC Dashboard</title>
    <script>
      // Apply the saved theme before first paint so dark mode never flashes light.
      (function () {
        var theme = 'light';
        try {
          var saved = localStorage.getItem('pg-theme');
          if (saved === 'dark' || saved === 'light') theme = saved;
        } catch (_) { /* storage unavailable */ }
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#080e1a' : '#f3f6fb');
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
